name: CI Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'Dockerfile.server'
      - '.dockerignore'
      - 'self-host/**'
      - 'contracts/self-host-server-image.schema.json'
      - 'scripts/build-self-host-bundle.py'
      - 'scripts/verify-self-host-bundle.py'
      - 'scripts/selfhost_release_contract.py'
      - 'scripts/self-host-image-smoke.sh'
      - 'scripts/self-host-image-smoke-probe.py'
      - 'scripts/self-host-compose-effective-check.sh'
      - 'scripts/verify-server-image-release.sh'
      - 'scripts/attach-umbrella-release-assets.sh'
      - 'scripts/admit-release-source.sh'
      - 'scripts/stage-bridge-release-assets.sh'
      - 'tests/test_self_host_*.py'
      - 'tests/test_server_image_verifier.py'
      - '.github/workflows/ci-server.yml'
      - '.github/workflows/release-server-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'Dockerfile.server'
      - '.dockerignore'
      - 'self-host/**'
      - 'contracts/self-host-server-image.schema.json'
      - 'scripts/build-self-host-bundle.py'
      - 'scripts/verify-self-host-bundle.py'
      - 'scripts/selfhost_release_contract.py'
      - 'scripts/self-host-image-smoke.sh'
      - 'scripts/self-host-image-smoke-probe.py'
      - 'scripts/self-host-compose-effective-check.sh'
      - 'scripts/verify-server-image-release.sh'
      - 'scripts/attach-umbrella-release-assets.sh'
      - 'scripts/admit-release-source.sh'
      - 'scripts/stage-bridge-release-assets.sh'
      - 'tests/test_self_host_*.py'
      - 'tests/test_server_image_verifier.py'
      - '.github/workflows/ci-server.yml'
      - '.github/workflows/release-server-image.yml'

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-server:
    name: Server Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      DJANGO_SETTINGS_MODULE: etebase_server.settings

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile Python modules
        working-directory: server
        run: |
          python -m py_compile manage.py
          python -m py_compile etebase_server/settings.py
          python -m py_compile etebase_server/urls.py
          python -m py_compile etebase_server/utils.py
          python -m py_compile etebase_server/myauth/tests.py

      - name: Verify Django app loads
        working-directory: server
        run: python -c "import django; django.setup(); print('Django loaded OK')"

      - name: Run FastAPI route contract tests
        working-directory: server
        run: |
          python -m pytest \
            etebase_server/fastapi/test_collection_route_contracts.py \
            etebase_server/fastapi/test_item_list_queryset.py \
            etebase_server/fastapi/test_authentication.py \
            -v --tb=short

      - name: Verify Docker secret exclusions
        run: |
          grep -Fx 'secret.txt' .dockerignore
          grep -Fx '**/secret.txt' .dockerignore
          grep -Fx '/secret.txt' server/.dockerignore
          grep -Fx '**/secret.txt' server/.dockerignore

      - name: Lint with ruff
        working-directory: server
        run: ruff check . --select=E,F,I --ignore=E501
        continue-on-error: true

      - name: Run tests
        working-directory: server
        run: python -m pytest etebase_server/ -v --tb=short

  self-host-contracts:
    name: Self-Host Release Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install contract test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML==6.0.3

      - name: Run self-host release contract tests
        run: python -m pytest tests/test_self_host_*.py tests/test_server_image_verifier.py -q

      - name: Verify the effective self-host Compose configuration
        run: scripts/self-host-compose-effective-check.sh

      - name: Check release and self-host shell syntax
        run: |
          for script in \
            self-host/install.sh \
            self-host/update.sh \
            self-host/verify.sh \
            self-host/close-signups.sh \
            scripts/self-host-image-smoke.sh \
            scripts/self-host-compose-effective-check.sh \
            scripts/verify-server-image-release.sh \
            scripts/attach-umbrella-release-assets.sh \
            scripts/admit-release-source.sh \
            scripts/stage-bridge-release-assets.sh; do
            bash -n "$script"
          done

  self-host-image:
    name: Self-Host Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Native build only: no registry credentials, no push, no environment.
      # This is the same image content the release workflow publishes, built and
      # smoked here before any tag exists.
      - name: Build the server image for ${{ matrix.platform }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.server
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          provenance: false
          sbom: false
          tags: silentsuite-server:ci-${{ matrix.arch }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=ci-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-server-${{ matrix.arch }}

      - name: Run the self-host image smoke contract
        run: |
          scripts/self-host-image-smoke.sh \
            --image "silentsuite-server:ci-${{ matrix.arch }}" \
            --platform "${{ matrix.platform }}" \
            --expect-revision "${{ github.sha }}"
