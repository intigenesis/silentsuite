name: Release Readiness

# The final, read-only gate of the protected-main release control plane.
#
# The three component lanes each append to one shared draft and none of them can
# see what the others produced, so "every lane succeeded" has never meant "the
# release is publishable". This job answers that question and nothing else: it
# holds contents:read, issues only GET requests, and has no path to publishing.
# Publication stays a deliberate human action.

on:
  workflow_call:
    inputs:
      release_tag:
        description: The admitted immutable release tag.
        required: true
        type: string
      source_sha:
        description: The admitted 40-hex source commit.
        required: true
        type: string

permissions: {}

jobs:
  readiness:
    name: Prove the umbrella draft is complete
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out the trusted controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Prove the umbrella draft is complete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          python3 scripts/verify-umbrella-release-readiness.py \
            --tag "$RELEASE_TAG" \
            --commit "$SOURCE_SHA"
