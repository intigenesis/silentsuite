name: Release Android

# Android component of the protected-main release control plane.
#
# Reachable only through `workflow_call`, and only ever called by
# release-controller.yml with `uses: ./…`, which resolves this file at the
# controller's protected default-branch commit. There is no tag push, no
# dispatch and no ref selection that can substitute a different definition of
# this lane.
#
# The signing boundary this preserves is unchanged from the tag-triggered
# design and is enforced byte-for-byte by scripts/check-android-signing-boundary.py:
#
#   signing-policy       trusted structural gate, contents: read
#   conscrypt-r28        candidate build, contents: read
#   build-release        holds the keystore; contents: read, no persisted
#                        checkout credential or release API; the read token is
#                        scoped only to trusted identity-revalidation steps
#   attach-release-assets  holds contents: write; no environment, no signing
#                        secret, no Gradle — only the closed artifact and the
#                        trusted attachment helper

on:
  workflow_call:
    inputs:
      release_tag:
        description: The admitted immutable release tag.
        required: true
        type: string
      source_sha:
        description: The admitted 40-hex source commit.
        required: true
        type: string

permissions: {}

jobs:
  signing-policy:
    name: Enforce Android signing boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install signing policy dependency
        run: |
          printf '%s\n' 'PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc' > "$RUNNER_TEMP/android-signing-policy-requirements.txt"
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/android-signing-policy-requirements.txt"

      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Enforce Android signing boundary
        run: python "$GITHUB_WORKSPACE/scripts/check-android-signing-boundary.py"

  conscrypt-r28:
    name: Build Conscrypt with Android NDK r28
    needs: signing-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout the admitted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK r28 and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --install "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build Conscrypt with Android NDK r28
        run: |
          chmod +x scripts/build-conscrypt-android-r28.sh
          scripts/build-conscrypt-android-r28.sh

      - name: Verify rebuilt Conscrypt AAR
        run: |
          python3 scripts/verify-native-16kb.py \
            --require-lib libconscrypt_jni.so \
            --require-android-ndk-major libconscrypt_jni.so=28 \
            build/conscrypt-m2/org/conscrypt/conscrypt-android/2.6.3-r28/conscrypt-android-2.6.3-r28.aar

      - name: Upload rebuilt Conscrypt AAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conscrypt-r28-${{ inputs.source_sha }}
          path: android/build/conscrypt-m2
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────
  # The lane's entry gate: `build-release` cannot start until this passes, so
  # the environment-gated job is never even scheduled for a tag that has already
  # moved. It runs trusted controller code on a runner with no candidate tree on
  # it at all, which is the one thing the in-job checks cannot claim.
  #
  # It is not the last word. A job boundary is not "immediately before" anything
  # — the signed build still has to check out, install an NDK and build an AAR
  # before it reaches the keystore — so `build-release` revalidates again at each
  # of its own irreversible boundaries, from its own trusted checkout.
  #
  # It waits on conscrypt-r28 deliberately: running it at the head of the lane
  # would put a half-hour native build between this gate and the signed job.
  # ─────────────────────────────────────────────────────────────────────
  revalidate-signing:
    name: Revalidate the release identity before signing
    needs: conscrypt-r28
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the trusted controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Verify the live release identity and tag rulesets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/verify-release-identity.sh" \
            --tag "$RELEASE_TAG" \
            --commit "$SOURCE_SHA" \
            --stage android-signing

  # ─────────────────────────────────────────────────────────────────────
  # Release build — signed, on the admitted commit only.
  #
  # Uses a protected GitHub Environment so signing secrets are not
  # accessible to PRs, forks, or anything outside this called lane.
  #
  # This job holds signing material and therefore holds no repository write: no
  # contents:write, no persisted checkout credential, no release API write, no
  # attachment helper. It hands its signed output to `attach-release-assets`
  # through a closed artifact, and that job — which has none of the signing
  # material — is the only thing that can write a release.
  #
  # It does carry the read-only workflow token, and only in the three reviewed
  # revalidation steps below. Those run trusted verifier code checked out
  # separately from `${{ github.sha }}` into `.release-trusted`, and they bracket
  # every irreversible act in this job: the keystore is not decoded, no signed
  # byte leaves, and the closed asset set is not handed to the write-capable lane
  # until the live tag, its commit and both tag rulesets have just been
  # re-confirmed. Candidate Gradle and candidate scripts never see the token.
  # ─────────────────────────────────────────────────────────────────────
  build-release:
    name: Build (signed, admitted release)
    needs: [signing-policy, conscrypt-r28, revalidate-signing]
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      # Second, and into its own directory: the candidate checkout above cleans
      # the workspace root, so the trusted verifier has to land after it and
      # outside it. Nothing in the Android build reads from this path.
      - name: Check out the trusted controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-trusted
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android NDK r28
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build 16 KB-aligned Etebase client AAR
        run: scripts/build-etebase-client-16kb.sh

      - name: Download rebuilt Conscrypt AAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.1
        with:
          name: conscrypt-r28-${{ inputs.source_sha }}
          path: android/build/conscrypt-m2

      # Immediately before the release key exists on this runner. Everything
      # above is reversible; nothing below it is.
      - name: Revalidate the release identity before decoding signing material
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.release-trusted/scripts/verify-release-identity.sh" \
            --tag "$RELEASE_TAG" \
            --commit "$SOURCE_SHA" \
            --stage android-signing-material

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/silentsuite-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore/silentsuite-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        env:
          KSTOREPWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PrequireEtebase16Kb=true \
            -PrequireConscryptR28=true \
            -PsigningStoreLocation="$KEYSTORE_PATH" \
            -PsigningKeyAlias="$KEY_ALIAS"

      - name: Capture release dependency graph and generate signed-release splits
        env:
          BUNDLETOOL_VERSION: '1.18.1'
          BUNDLETOOL_SHA256: '675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c'
          KSTOREPWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p build/privacy-evidence/dependencies build/privacy-evidence/build-metadata
          ./gradlew app:dependencies --configuration releaseRuntimeClasspath --no-daemon \
            > build/privacy-evidence/dependencies/release-runtime.txt
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "$RUNNER_TEMP/bundletool.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict
          umask 077
          BUNDLETOOL_PASSWORD_FILE="$RUNNER_TEMP/keystore/bundletool-password"
          printf '%s' "$KSTOREPWD" > "$BUNDLETOOL_PASSWORD_FILE"
          unset KSTOREPWD
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle app/build/outputs/bundle/release/app-release.aab \
            --output build/privacy-evidence/signed-release.apks \
            --mode universal \
            --ks="$KEYSTORE_PATH" --ks-key-alias="$KEY_ALIAS" \
            --ks-pass="file:$BUNDLETOOL_PASSWORD_FILE" \
            --key-pass="file:$BUNDLETOOL_PASSWORD_FILE"
          unzip -q build/privacy-evidence/signed-release.apks \
            -d build/privacy-evidence/signed-release-splits
          test -s app/build/outputs/mapping/release/mapping.txt
          mkdir -p build/privacy-evidence/build-metadata/app/build/outputs/mapping/release
          cp app/build/outputs/mapping/release/mapping.txt \
            build/privacy-evidence/build-metadata/app/build/outputs/mapping/release/mapping.txt
          find app/build/intermediates -type f \
            \( -iname '*manifest*.xml' -o -iname '*mapping*.txt' -o -iname 'resources*.txt' -o -iname 'resources*.arsc' \) \
            -exec cp --parents {} build/privacy-evidence/build-metadata/ \;
          sha256sum app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            build/privacy-evidence/signed-release.apks \
            > build/privacy-evidence/artifact-sha256.txt
          python3 scripts/scan-tracker-signatures.py \
            --manifest security/tracker-signatures.json \
            --summary build/privacy-evidence/tracker-scan-summary.json \
            build/privacy-evidence/dependencies \
            build/privacy-evidence/build-metadata \
            app/build/outputs/apk/release \
            app/build/outputs/bundle/release \
            build/privacy-evidence/signed-release.apks \
            build/privacy-evidence/signed-release-splits

      # The privacy evidence carries the signed universal .apks set, so this is
      # the first byte produced with the release key that leaves the job.
      - name: Revalidate the release identity before publishing signed artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.release-trusted/scripts/verify-release-identity.sh" \
            --tag "$RELEASE_TAG" \
            --commit "$SOURCE_SHA" \
            --stage android-signed-artifact-egress

      - name: Upload signed tracker verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-tracker-scan-${{ inputs.source_sha }}
          path: android/build/privacy-evidence/
          retention-days: 30

      - name: Verify release native libraries
        run: |
          python3 scripts/verify-native-16kb.py \
            --require-lib libetebase_android.so \
            --require-lib libconscrypt_jni.so \
            --require-android-ndk-major libetebase_android.so=28 \
            --require-android-ndk-major libconscrypt_jni.so=28 \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab

      # libconscrypt_jni.so and the upstream 32-bit libetebase_android.so ship
      # pre-stripped, so no symbols can be extracted for them; only the locally
      # rebuilt 64-bit Etebase libraries carry symbol tables. AGP 8.11.1 does
      # not emit a native-debug-symbols.zip for prebuilt-AAR-only native
      # libraries, so the ZIP is packaged manually from the rebuilt AAR.
      - name: Package release native debug symbols
        run: |
          python3 scripts/package-native-debug-symbols.py \
            --etebase-aar app/libs/client-2.3.2-16kb.aar \
            --output app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip

      - name: Verify release native debug symbols
        run: |
          python3 scripts/verify-native-debug-symbols.py \
            --require-lib libetebase_android.so \
            --require-lib libconscrypt_jni.so \
            --require-symbol arm64-v8a/libetebase_android.so \
            --require-symbol x86_64/libetebase_android.so \
            --bundle app/build/outputs/bundle/release/app-release.aab \
            --symbols app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Verify AAB signature
        run: jarsigner -verify -certs -verbose app/build/outputs/bundle/release/*.aab

      - name: Revalidate the release identity before publishing signed release outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.release-trusted/scripts/verify-release-identity.sh" \
            --tag "$RELEASE_TAG" \
            --commit "$SOURCE_SHA" \
            --stage android-release-output-egress

      - name: Upload signed release APK, AAB, and native debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: silentsuite-release-${{ inputs.source_sha }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: error
          retention-days: 30

      - name: Rename Android artifacts for release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/silentsuite-android-${RELEASE_TAG}.apk"
          mv app/build/outputs/bundle/release/app-release.aab \
             "app/build/outputs/bundle/release/silentsuite-android-${RELEASE_TAG}.aab"
          mv app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip \
             "app/build/outputs/native-debug-symbols/release/silentsuite-android-${RELEASE_TAG}-native-debug-symbols.zip"
          cd app/build/outputs/apk/release
          sha256sum "silentsuite-android-${RELEASE_TAG}.apk" \
            > "silentsuite-android-${RELEASE_TAG}-installer.sha256"
          cd ../../bundle/release
          sha256sum "silentsuite-android-${RELEASE_TAG}.aab" \
            > "silentsuite-android-${RELEASE_TAG}-bundle.sha256"
          cd ../../native-debug-symbols/release
          sha256sum "silentsuite-android-${RELEASE_TAG}-native-debug-symbols.zip" \
            > "silentsuite-android-${RELEASE_TAG}-native-debug-symbols.sha256"

      # Collect exactly the six release assets into one flat directory, so the
      # artifact this job publishes has a closed, named inventory the attachment
      # job can re-assert before it writes anything.
      - name: Stage the closed release-asset set
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p build/release-assets
          mv "app/build/outputs/apk/release/silentsuite-android-${RELEASE_TAG}.apk" \
             "app/build/outputs/apk/release/silentsuite-android-${RELEASE_TAG}-installer.sha256" \
             "app/build/outputs/bundle/release/silentsuite-android-${RELEASE_TAG}.aab" \
             "app/build/outputs/bundle/release/silentsuite-android-${RELEASE_TAG}-bundle.sha256" \
             "app/build/outputs/native-debug-symbols/release/silentsuite-android-${RELEASE_TAG}-native-debug-symbols.zip" \
             "app/build/outputs/native-debug-symbols/release/silentsuite-android-${RELEASE_TAG}-native-debug-symbols.sha256" \
             build/release-assets/
          ls -l build/release-assets

      # The last gate in this job: past this point the closed asset set is
      # available to `attach-release-assets`, which holds contents: write.
      - name: Revalidate the release identity before the attachment handoff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.release-trusted/scripts/verify-release-identity.sh" \
            --tag "$RELEASE_TAG" \
            --commit "$SOURCE_SHA" \
            --stage android-attachment-handoff

      - name: Publish the closed release-asset set to the attachment job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: silentsuite-android-release-assets-${{ inputs.source_sha }}
          path: android/build/release-assets/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"

  # ─────────────────────────────────────────────────────────────────────
  # Release attachment — the only Android job that can write a release.
  #
  # It has contents:write and no signing material: no `android-release`
  # environment, no keystore, no signing secrets, no Gradle. All it does is
  # download the closed asset set the signed job produced, re-assert that the
  # inventory is exactly what was promised, and hand it to the hardened
  # attachment helper checked out from the protected controller revision.
  #
  # The helper — not a marketplace release action — is what writes. It
  # revalidates the live tag and both rulesets on either side of the upload,
  # refuses a published release outright, never deletes or replaces an asset,
  # preserves siblings, and reads every upload back.
  # ─────────────────────────────────────────────────────────────────────
  attach-release-assets:
    name: Attach Android assets to the draft release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared tag-scoped domain with the Bridge and self-host attachment jobs, so
    # the three components never append to the same umbrella draft at once.
    # Never cancel: a cancelled attachment silently drops a component.
    #
    # queue: max is load-bearing, not decoration. Under the default (single) the
    # scheduler keeps only one pending job per group and replaces it, so with
    # three components one attachment would be cancelled while merely waiting —
    # the umbrella draft would come out a component short with nothing failing.
    # max holds them in FIFO instead. It cannot be combined with
    # cancel-in-progress: true, which is fine: never cancelling is the point.
    #
    # The group reads the dispatch payload rather than an input because a job's
    # concurrency group is evaluated as the job is queued; the payload tag is
    # the same string the controller admitted, and no attachment job can run
    # until that admission has passed.
    concurrency:
      group: umbrella-release-${{ github.event.client_payload.release_tag }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out the trusted controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Download the closed release-asset set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: silentsuite-android-release-assets-${{ inputs.source_sha }}
          path: release-assets

      # The signed job promised exactly six files. Anything else here means the
      # artifact is not what was built, and nothing is uploaded.
      - name: Re-assert the closed asset inventory
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          EXPECTED="$(printf '%s\n' \
            "silentsuite-android-${RELEASE_TAG}-bundle.sha256" \
            "silentsuite-android-${RELEASE_TAG}-installer.sha256" \
            "silentsuite-android-${RELEASE_TAG}-native-debug-symbols.sha256" \
            "silentsuite-android-${RELEASE_TAG}-native-debug-symbols.zip" \
            "silentsuite-android-${RELEASE_TAG}.aab" \
            "silentsuite-android-${RELEASE_TAG}.apk" | LC_ALL=C sort)"
          ACTUAL="$(find release-assets -mindepth 1 -printf '%P\n' | LC_ALL=C sort)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Refusing attachment: the release-asset set is not the closed inventory" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$EXPECTED" "$ACTUAL" >&2
            exit 1
          fi
          echo "Closed inventory confirmed for ${RELEASE_TAG}"

      - name: Attach the Android assets to the shared draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/attach-umbrella-release-assets.sh" \
